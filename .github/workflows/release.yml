# Publishes a release when a version tag is pushed:
#   - the relay image, ghcr.io/<owner>/<repo>:<tag> (never "latest")
#   - a static clavix-agent for x86_64 Linux, with its SHA-256
# Nothing runs on ordinary pushes.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build and push the relay image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            -t "$image" .
          docker push "$image"

  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build a static agent (musl)
        # Built on Alpine so the binary depends on no system library and
        # runs on any x86_64 Linux, whatever its libc.
        run: |
          docker run --rm -v "$PWD":/src -w /src/agent rust:1-alpine sh -c \
            'apk add --no-cache musl-dev >/dev/null && cargo build --release --locked'
          mkdir dist
          cp agent/target/release/clavix-agent "dist/clavix-agent-${GITHUB_REF_NAME}-x86_64-linux"
          cd dist && sha256sum clavix-agent-* > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
