# Every test of the repository, end-to-end ones included: a scratch sshd,
# the stock ssh client, the relay, the fake phone and the real page in
# headless Chrome. One job, to keep hosted minutes low.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A missing tool must fail the job, not skip the end-to-end tests.
      CLAVIX_REQUIRE_E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install sshd and the relay's dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server python3-cryptography python3-httpx python3-h2
          sudo mkdir -p /run/sshd
      - name: Rust — format, lint, tests (agent with ssh end to end, approve-mode requester)
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Relay — tests
        run: python3 -m unittest discover -s relay
      - name: Page modules — tests
        run: npm test
      - name: Approve mode — end to end (relay, fake desktop, fake phone)
        run: node tools/approve-e2e.mjs
      - name: Page — end to end in headless Chrome
        run: node tools/page-e2e.mjs

  # The native app's protocol library (ios/ClavixCore), on macOS for
  # CryptoKit and the Security framework, checked against the page's own
  # modules in both directions (tools/ios-interop.mjs).
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CLAVIX_REQUIRE_INTEROP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: ClavixCore — tests, with the page's vectors
        run: |
          node tools/ios-interop.mjs make "$RUNNER_TEMP/js.json"
          export CLAVIX_JS_VECTORS="$RUNNER_TEMP/js.json" CLAVIX_SWIFT_OUT="$RUNNER_TEMP/swift.json"
          swift test --package-path ios/ClavixCore
          node tools/ios-interop.mjs check "$RUNNER_TEMP/js.json" "$RUNNER_TEMP/swift.json"
